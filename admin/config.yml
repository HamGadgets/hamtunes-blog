backend:
  name: github 
  repo: HamGadgets/hamtunes-blog
  branch: main

site_url: https://celadon-lebkuchen-2fbe9e.netlify.app
display_url: https://celadon-lebkuchen-2fbe9e.netlify.app
logo_url: https://celadon-lebkuchen-2fbe9e.netlify.app/assets/hamtunes-profile.jpg

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "content"
    label: "HamTunes Content"
    files:
      - name: "articles"
        label: "Articles"
        file: "content/articles.json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{title}} — {{status}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Slug", name: "slug", widget: "string", hint: "lowercase words separated by hyphens"}
              - {label: "Category", name: "category", widget: "select", options: ["News", "Music", "Lifestyle", "Technology", "Business"]}
              - {label: "Excerpt", name: "excerpt", widget: "text"}
              - {label: "Cover image", name: "cover_image", widget: "image", required: false}
              - {label: "Author", name: "author", widget: "string", default: "HamTunes"}
              - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
              - {label: "Status", name: "status", widget: "select", options: ["draft", "published"], default: "draft"}
              - {label: "Read time", name: "read_time", widget: "string", default: "5 min read"}
              - {label: "Article", name: "body", widget: "markdown"}
